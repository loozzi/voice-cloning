[project]
name = "voice-cloning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "qwen-tts>=0.1.1",
    "arq>=0.26.1",
    "redis>=5.0.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "bitsandbytes>=0.49.2",
    "torch==2.5.1",
    "torchaudio==2.5.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
